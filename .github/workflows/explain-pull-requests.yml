# This repository's pull request explainer, set up as
# https://bisque.today/docs/github.md describes. Claude Code reads each pull
# request first and explains the ones someone who did not write it would want
# walked through; the rest get no comment, with the reason in the run's log.
#
# Run it by hand with a pull request number to explain one that is already
# open or merged, whatever Claude Code would have decided.
#
# Pull requests from forks are left out: GitHub gives those runs no secrets.
#
# .github/ lives only in this repository; the skills mirror never touches it.
name: Pull request explainer

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pull-request:
        description: A pull request number to explain, open or merged, e.g. 1
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write # post the watch link
  id-token: write # sign in with GitHub to publish

concurrency:
  group: explain-pull-request-${{ inputs.pull-request || github.event.pull_request.number }}

jobs:
  explain:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: bisque-cloud/presenter@v1
        with:
          source: pull-request
          pull-request: ${{ inputs.pull-request }}
          when: judged
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
